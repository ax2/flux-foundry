name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Confirm version and stage notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -ne 'tag' -or '${{ github.ref_name }}' -ne "v$version") { throw 'Run from the matching version tag.' }
          $notes = Get-ChildItem 'docs/iterations' -Recurse -Filter "v$version.md" | Select-Object -First 1
          if (!$notes -or !(Test-Path (Join-Path $notes.DirectoryName 'worklog.md'))) { throw 'Missing version notes or stage archive.' }
      - run: npm run build
      - name: Package with installed Electron and bounded download retries
        run: node scripts/package-windows.mjs
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
      - run: node scripts/desktop-smoke.mjs
      - run: node scripts/desktop-smoke.mjs --portable
      - name: Publish EXE and checksums (no game ZIP)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem "releases/v$version/Flux-Foundry-*-Windows-x64.exe" | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content "releases/v$version/SHA256SUMS.txt" -Encoding ascii
          gh release view "v$version" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Existing release preserved; no assets overwritten.'; exit 0 }
          $notes = Get-ChildItem 'docs/iterations' -Recurse -Filter "v$version.md" | Select-Object -First 1
          gh release create "v$version" $exe.FullName "releases/v$version/SHA256SUMS.txt" --title "Flux Foundry v$version" --notes-file $notes.FullName --verify-tag
