name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      - run: google-chrome --version
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - run: npm run test:update
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - run: npm run test:feedback
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - run: npm run test:endurance
      - run: npm run test:varied
      - run: npm run test:sparse
      - run: npm run test:multi
      - run: npm run test:active
      - run: npm run test:full
      - run: npm run test:loading
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - run: npm run test:expedition
      - run: npm run test:touch
      - run: npm run test:residual
      - run: npm run test:edge
      - run: npm run test:balance
